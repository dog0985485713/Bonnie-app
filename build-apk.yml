name: Build Bonnie v2.43 Fixed Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Bonnie-project-v2.43-fixed.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Bonnie v2.43 fixed project
        run: |
          mkdir extracted-project
          unzip -q Bonnie-project-v2.43-fixed.zip -d extracted-project
          test -f extracted-project/settings.gradle.kts
          test -f extracted-project/app/build.gradle.kts

      - name: Verify lifecycle methods
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "extracted-project/app/src/main/java/tw/bonnie/pet/MainActivity.java"
          ).read_text(encoding="utf-8")
          count = source.count("void onResume()")
          print(f"onResume count: {count}")
          if count != 1:
              raise SystemExit(f"Expected exactly one onResume, found {count}")
          PY

      - name: Build fixed-signed release APK
        working-directory: extracted-project
        run: gradle --no-daemon assembleRelease

      - name: Upload fixed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bonnie-v2.43-fixed-signed-apk
          path: extracted-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
