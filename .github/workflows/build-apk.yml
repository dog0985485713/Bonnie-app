name: Build Bonnie APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Bonnie project
        run: |
          mkdir bonnie-project
          unzip Bonnie-project-v2.53.zip -d bonnie-project

      - name: Build debug APK
        working-directory: bonnie-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bonnie-debug-apk
          path: bonnie-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
